# Copy to profile/profile.yaml and make it yours. Every prompt reads this file; nothing about you is hard-coded.
# (Example values. The app's first user was a recent economics graduate searching in Chicago.)
name: Alex                      # first name, used to sign emails
school: State University        # used to find alumni at each company
degree: B.S. Economics (State University)
grad_year: 2026
grad_month: May                 # programs limited to a future graduation date won't fit if you've graduated
experience: see profile/facts.md — one-line summary of your roles
tools: [Excel, Stata, PowerPoint]
wants: [economic consulting, economic or policy research, market research, financial-markets research]   # in priority order
never: [sales, business development]
locations:
  ok: [City of Chicago, any Chicagoland suburb, US remote (Illinois eligible)]
  no: [Wisconsin]
experience_rule: none required; 1 year of general experience passes as a stretch; 2+ years, or any years in a specific field, fails
work_mode: [hybrid, remote]
pay_floor: {hybrid: 65000, remote: 55000}   # midpoint of posted range; no pay posted = kept and flagged
email_subject: "{school} graduate — {role} at {company}"
